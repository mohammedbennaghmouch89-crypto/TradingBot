[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.0.0"
description = "Phase 2 trading bot driven by the Phase 1 TradingView/Pine Script indicator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "ccxt>=4.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, strict-but-practical default rule set.
select = ["E", "F", "I", "UP", "B", "SIM", "PERF"]

[tool.mypy]
python_version = "3.11"
packages = ["tradingbot"]
mypy_path = "src"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
