<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="820" fill="#f8fafc"/>

  <!-- title -->
  <text x="640" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Phase 2 — TradingView Indicator → Bot → Alpaca Paper (NASDAQ)</text>
  <text x="640" y="78" text-anchor="middle" font-size="16" fill="#64748b">Signal flow from your Pine indicator to a simulated paper trade, with logging</text>

  <!-- ROW 1: linear flow -->
  <!-- Box 1: Indicator -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="240" height="120" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="160" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">1. Indicator</text>
  <text x="160" y="196" text-anchor="middle" font-size="14" fill="#334155">Pine Script v6</text>
  <text x="160" y="218" text-anchor="middle" font-size="13" fill="#64748b">alert() fires JSON</text>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#64748b">on buy / sell signal</text>

  <!-- Box 2: TradingView Alert -->
  <g filter="url(#shadow)">
    <rect x="360" y="130" width="240" height="120" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="480" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">2. TradingView Alert</text>
  <text x="480" y="196" text-anchor="middle" font-size="14" fill="#334155">Webhook (HTTPS POST)</text>
  <text x="480" y="218" text-anchor="middle" font-size="13" fill="#64748b">sends JSON payload</text>
  <text x="480" y="238" text-anchor="middle" font-size="13" fill="#64748b">(paid TV plan required)</text>

  <!-- Box 3: Supabase Edge Function -->
  <g filter="url(#shadow)">
    <rect x="680" y="130" width="260" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="810" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">3. Supabase Edge Fn</text>
  <text x="810" y="192" text-anchor="middle" font-size="13" fill="#334155">the bot's brain</text>
  <text x="810" y="213" text-anchor="middle" font-size="12.5" fill="#64748b">auth · validate · risk rules</text>
  <text x="810" y="232" text-anchor="middle" font-size="12.5" fill="#64748b">place order · log</text>

  <!-- Box 4: Alpaca -->
  <g filter="url(#shadow)">
    <rect x="1020" y="130" width="220" height="120" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="1130" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">4. Alpaca</text>
  <text x="1130" y="196" text-anchor="middle" font-size="14" fill="#334155">Paper Trading API</text>
  <text x="1130" y="218" text-anchor="middle" font-size="13" fill="#64748b">executes simulated</text>
  <text x="1130" y="238" text-anchor="middle" font-size="13" fill="#64748b">NASDAQ order</text>

  <!-- arrows row1 -->
  <line x1="280" y1="190" x2="356" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="180" text-anchor="middle" font-size="11" fill="#64748b">alert()</text>
  <line x1="600" y1="190" x2="676" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="638" y="180" text-anchor="middle" font-size="11" fill="#64748b">webhook</text>
  <line x1="940" y1="190" x2="1016" y2="190" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="978" y="180" text-anchor="middle" font-size="11" fill="#16a34a">REST</text>

  <!-- JSON payload sample under box1->box2 -->
  <g filter="url(#shadow)">
    <rect x="320" y="290" width="360" height="120" rx="10" fill="#0f172a"/>
  </g>
  <text x="338" y="316" font-size="12.5" fill="#7dd3fc" font-family="monospace">{</text>
  <text x="350" y="334" font-size="12.5" fill="#e2e8f0" font-family="monospace">"symbol": "AAPL",</text>
  <text x="350" y="352" font-size="12.5" fill="#e2e8f0" font-family="monospace">"action": "buy",</text>
  <text x="350" y="370" font-size="12.5" fill="#e2e8f0" font-family="monospace">"qty": 10,</text>
  <text x="350" y="388" font-size="12.5" fill="#e2e8f0" font-family="monospace">"secret": "•••••"</text>
  <text x="338" y="404" font-size="12.5" fill="#7dd3fc" font-family="monospace">}</text>
  <line x1="480" y1="250" x2="480" y2="286" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- Box: Postgres logging -->
  <g filter="url(#shadow)">
    <rect x="690" y="320" width="240" height="110" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="810" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Supabase Postgres</text>
  <text x="810" y="382" text-anchor="middle" font-size="13" fill="#64748b">signals · orders · P&amp;L</text>
  <text x="810" y="402" text-anchor="middle" font-size="13" fill="#64748b">full audit log</text>
  <!-- arrow edge fn -> postgres -->
  <line x1="810" y1="250" x2="810" y2="316" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="828" y="288" text-anchor="start" font-size="11" fill="#16a34a">log</text>

  <!-- Guardrails panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="470" width="1200" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <text x="64" y="506" font-size="18" font-weight="700" fill="#0f172a">Guardrails inside the Edge Function (step 3)</text>

  <!-- guardrail items -->
  <g font-size="14" fill="#334155">
    <circle cx="80" cy="540" r="5" fill="#16a34a"/>
    <text x="96" y="545">Webhook auth (shared secret)</text>
    <circle cx="80" cy="572" r="5" fill="#16a34a"/>
    <text x="96" y="577">Payload validation (symbol, qty, action)</text>
    <circle cx="80" cy="604" r="5" fill="#16a34a"/>
    <text x="96" y="609">Risk rules (position sizing, max positions)</text>

    <circle cx="470" cy="540" r="5" fill="#16a34a"/>
    <text x="486" y="545">Idempotency / dedupe (no double orders)</text>
    <circle cx="470" cy="572" r="5" fill="#16a34a"/>
    <text x="486" y="577">Market-hours check (NASDAQ session)</text>
    <circle cx="470" cy="604" r="5" fill="#16a34a"/>
    <text x="486" y="609">Kill switch (disable trading instantly)</text>

    <circle cx="880" cy="540" r="5" fill="#16a34a"/>
    <text x="896" y="545">Secrets stored in Supabase, never in git</text>
    <circle cx="880" cy="572" r="5" fill="#16a34a"/>
    <text x="896" y="577">Audit every signal (even rejected)</text>
    <circle cx="880" cy="604" r="5" fill="#16a34a"/>
    <text x="896" y="609">Paper keys now → same code for live later</text>
  </g>

  <!-- Note bar -->
  <g filter="url(#shadow)">
    <rect x="40" y="680" width="1200" height="90" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="64" y="714" font-size="15" font-weight="700" fill="#b45309">NASDAQ note</text>
  <text x="64" y="740" font-size="13.5" fill="#78350f">Alpaca trades stocks &amp; ETFs (e.g. AAPL, NVDA, or QQQ for Nasdaq-100 exposure) — not the NDX index or NQ futures directly.</text>
  <text x="64" y="760" font-size="13.5" fill="#78350f">Paper account uses the same API as live; only the base URL and keys differ.</text>
</svg>
